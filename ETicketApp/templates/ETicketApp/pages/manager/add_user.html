{% extends "global/base_manager.html" %}

{% block content %}
{% include 'ETicketApp/partials/manager/sideBar.html' %}

<div class="container" style="margin-left: 5%;">  
    <div class="row justify-content-center" style="margin-top: 8%; margin-left: 5%;"> 
        <div id="Conteudo-total"> 
            <div class="row justify-content-center"> 
                
                <div class="col-8 col-md-8 d-flex flex-column align-items-center"> 
                    <h1 id="usuarios-lista">Usuários</h1>
                    <div class="d-flex flex-column flex-md-row col-12 align-items-start mx-3 mb-3">
                        <div class="search-container">
                            <label for="name" class="form-label">Nome</label>
                            <input id="usuarios" class="form-control">
                        </div>
                        <div class="col-12 col-md-4 d-flex flex-column align-items-start">
                            <label for="papel" class="form-label">Papel</label>
                            <select id="selecao" class="form-select" aria-label="Default select example">
                                <option selected>Tipo de Usuário</option>
                                <option value="1">ADM</option>
                                <option value="2">Colaborador</option>
                                <option value="3">Bolsista</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="search-container d-flex flex-column mx-3 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" class="form-control">
                    </div>

                    <div class="col-10 col-md-12 d-flex flex-column align-items-start mx-3 mb-3">
                        <div class="d-flex flex-column flex-md-row justify-content-between w-100 mt-3">
                            <a href="{% url 'usuarios' %}" class="btn btn-secondary mb-2 mb-md-0" style="font-size: 20px; width: 120px;">
                                <i class="fa-solid fa-arrow-left"></i> Voltar 
                            </a>
                            
                         
                            <button class="btn btn-success" style="font-size: 20px; background-color: #35A40E; width: 120px;" 
                                type="button" onclick="alert('Usuário Salvo com Sucesso!');">
                                Salvar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
