{% extends 'global/base_manager.html' %}

{% block content %}
{% include 'ETicketApp/partials/manager/sideBar.html' %}
{% include 'ETicketApp/partials/manager/alerta.html' %}

<form {% url 'menu' %} method="post">
    {% csrf_token %}
<div class="container-cardapio">
    <h2>Cardápio:</h2>
    <input type="date" class='data'></input>
    
    <div class="section-refeicoes">
        <label for="cafe">Café Da Manhã:</label>
        <textarea rows="4" cols="50" name="cafe"></textarea>
    </div>

    <div class="section-refeicoes">
        <label for="almoco">Almoço:</label>
        <textarea rows="4" cols="50" name="almoco"></textarea>
    </div>

    <div class="section-refeicoes">
        <label for="jantar">Jantar:</label>
        <textarea rows="4" cols="50" name="jantar"></textarea>
    </div>
<div class="continuar">
    <button class="btn-continuar">Continuar</button>
</div>
</div>
</form>
{% endblock %}
