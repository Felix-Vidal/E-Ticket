{% extends "global/base_manager.html" %}

{% block content %}
{% include 'ETicketApp/partials/manager/sideBar.html' %}
{% include 'ETicketApp/partials/manager/alerta.html' %}

<div class="container-fluid d-flex justify-content-center align-items-start mt-5">
    <div class="col-6 col-md-6 col-lg-6 mx-auto" style="margin-left: 5%; margin-top: 5%;">
        <h1 class="text-center mb-4">Validar QRCode:</h1>

        <!-- Elemento onde a câmera vai exibir a imagem -->
        <div id="reader" style="width: 100%; max-width: 350px; margin: 0 auto;"></div>
            
        <form id="codigo-form" method="POST" action="{% url 'validarUsuario' %}">
            {% csrf_token %}
            
            <!-- Input manual -->
            <div class="mb-3 mt-3 text-center"> 
                <label style="font-size: 20px;" class="form-label">Entrar com código:</label>
                <input id="matricula" name="matricula" type="text" style="border: 2px solid #007bff; max-width: 300px;" type="text" class="form-control mx-auto" placeholder="Digite o código" required>
            </div>
        
            <!-- Botões -->
            <div class="d-flex justify-content-center mb-2"> 
                <a href="{% url 'manage' %}" class="btn btn-secondary" style="font-size: 20px; width: 120px; margin-right: 8%;">Voltar</a>
                <button id="btn-avancar" type="submit" class="btn btn-primary" style="font-size: 20px; background-color: #0E4DA4; width: 120px;">Avançar</button>
            </div>
        </form>
    </div>
</div>



{% endblock content %}
