{% extends "global/base_manager.html" %}

{% block content %}
{% include 'ETicketApp/partials/manager/sideBar.html' %}
{% include 'ETicketApp/partials/manager/alerta.html' %}
<div id="maior" class="content d-flex justify-content-center">
    <div id="venda-unico" class="container-fluid">
        <div id="form-venda" class="row justify-content-center">
            
            <div id="form-venda" class="col-12 col-md-8 col-lg-8">
                <div class= "col-12 ol-md-8 col-lg-8">
                    <h1 id="titulo-gera">Gerar Ticket Unico </h1>
                </div>
                <form method="POST" action="{% url 'gerar_ticket_unico' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="Email" class="form-label">Email:</label>
                        <input id="input-email" name="email" type="email" class="form-control" aria-describedby="email">
                    </div>
                    
                    <!-- Classificação -->
                    <div class="col-12 col-md-5"> 
                        <label for="classificacao" class="form-label">Classificação:</label>
                        <select id="select-unico" name="classificacao" class="form-select w-100">
                            <option selected value="Comunidade Externa">Comunidade Externa</option>
                            <option value="Especial">Especial</option>
                        </select>
                    </div>
                
                    <!-- Forma de pagamento -->
                    <div class="col-12 col-md-5"> 
                        <label for="pagamento" class="form-label">Forma de pagamento:</label>
                        <select id="select-pagamento" name="pagamento" class="form-select w-100">
                            <option selected value="Pix">Pix</option>
                            <option value="Dinheiro">Dinheiro</option>
                            <option value="Cartao">Cartão</option>
                        </select>
                    </div>
                
                    <!-- Quantidades de refeições -->
                    <div class="col-12 col-md-5"> 
                        <label for="cafe" class="form-label">Qtd. Café da Manhã:</label>
                        <input id="cafee" name="cafe" type="number" class="form-control" min="0">
                    </div>
                    <div class="col-12 col-md-5"> 
                        <label for="janta" class="form-label">Qtd. de Jantar:</label>
                        <input id="jantar-label" name="janta" type="number" class="form-control" min="0">
                    </div>
                    <div class="col-12 col-md-5"> 
                        <label for="almoco" class="form-label">Qtd. de Almoço:</label>
                        <input id="almoco-label" name="almoco" type="number" class="form-control" min="0">
                    </div>
                    <div class="col-12 col-md-5"> 
                        <label for="refeicao" class="form-label">Qtd. de Qualquer Refeição:</label>
                        <input id="refeicao-label" name="refeicao" type="number" class="form-control" min="0">
                    </div>
                
                    <!-- Botões -->
                    <div class="d-flex flex-column flex-md-row justify-content-between">
                        <a id="volta" href="{% url 'vender' %}" class="btn btn-secondary mb-2">
                            <i class="fa-solid fa-arrow-left"></i> Voltar
                        </a>
                        
                        <button id="confirma" type="submit" class="btn btn-success">
                            <i class="fa-solid fa-check"></i> Confirmar
                        </button>
                    </div>
                </form>
            </div>
        
        </div>
    </div>   
</div>
{% endblock content %}
