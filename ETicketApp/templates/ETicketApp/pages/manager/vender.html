{% extends "global/base_manager.html" %}

{% block content %}
{% include 'ETicketApp/partials/manager/sideBar.html' %}

<div id="top" class="content d-flex justify-content-center">
    <div class="container-fluid">
        <div  class=" maior-venda row justify-content-center">
            
            <div class="col-12 col-md-6 col-lg-4"> 
                <h1  id="titulo-vender">Vender Ticket</h1>
                <a id="cardVenda"href="{% url 'vendaUnico' %}">
                <div id="card-gerar" class=" card mb-4">
                        <div id="card-icone " class="d-flex justify-content-center align-items-center">
                            <i id="icone-qr" class="fa-solid fa-qrcode"></i>
                        </div>
                        <div class="card-body text-center">
                            <p id="texto-venda" class="card-text">Gerar Ticket Único</p>
                        </div>
                    </div>
                </a>
                <div id="pesquisa-user" class="col-12 col-md-5 lg-4 ">
                    <label id="form1" class="form-label">Pesquisar Usuario:</label>
                    <input id="codigo" type="text" class="form-control" placeholder="Digite o código">
                </div> 
                <form id="codigo-form" method="POST" action="{% url 'usuarioCompra' %}">
                    {% csrf_token %}
                    <div id="botoes" class="d-flex flex-column flex-md-row justify-content-between col-12">
                        <div>
                            <a id="volta-geral" href="{% url 'manage' %}" class="btn btn-secondary mb-2 mb-md-0">
                                <i class="fa-solid fa-arrow-left"></i> Voltar
                            </a>
                        </div>
                        <div>
                            <button id="botao-pesquisa" type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-search"></i> Pesquisar
                            </button>
                        </div>
                        
                    </div>
                </form>
   
                
            </div>
            
        </div>
        
        
    </div>
</div>



{% endblock content %}
