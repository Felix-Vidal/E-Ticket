{% extends "global/base_user.html" %}

{% block title %}Login |{% endblock title %}

{% block content %}
{% include 'ETicketApp/partials/manager/alerta.html' %}
<body class='login'>
    <div class="login-container">
        <div class="login-box">
            <img src='../../../static/ETicketApp/img/ETICKET.png' alt="Logo" class="login-logo">
            <form id="login-form" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="number" id="cpf" name="cpf" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-button">Logar</button>
                <a type="submit" href="{% url 'menuExterno' %}" class="externo" style="margin-top: 1em; color:#000;">Sou um usuário externo</a>
            </form>
            <div id="error-message" style="color: red; display: none;"></div>
        </div>
    </div>


</body>
{% endblock content %}
