{% extends "global/base_user.html" %}
{% block content %}
{% include 'ETicketApp/partials/user/header.html' %}

<h1 id="title">Recarregar</h1>

<div id="decoracao" class="container d-flex">  
    <div class="col-md-12 col-12">
        <div>
            <form method="POST" action="{% url 'pagamento' %}">
                {% csrf_token %} <!-- CSRF token dentro do form -->

                <div class="mb-3">
                    <label for="valor" class="form-label">Valor R$:</label>
                    <input type="number" class="form-control" id="valor" name="valor" placeholder="00.00" required>
                </div>
                
                <!-- Botão de envio do formulário -->
                <div class="d-flex justify-content-center"> 
                    <button type="submit" id="confirma" class="btn btn-success">
                        <i class="fa-solid fa-check"></i> Confirmar
                </button> 
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
