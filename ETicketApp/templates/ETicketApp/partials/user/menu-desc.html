    <div class="meal-section">

               value="{% if cafe %}{{ cafe.menu }}{% else %}Indisponível{% endif %}" 
               placeholder="{% if cafe %}{{ cafe.menu }}{% else %}Indisponível{% endif %}"

        <h2 class="meal-title">Janta</h2>

               disabled>
