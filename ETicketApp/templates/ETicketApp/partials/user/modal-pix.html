<div class="modal fade" id="modal-pix" tabindex="-1" aria-labelledby="modalPixLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalPixLabel">Pix</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="img" class="modal-body">
            <img src="../../../static/ETicketApp/img/QRlogo.png" alt="" height="300px">
        </div>
      
        <div id="pix-cod" class="modal-body d-flex justify-content-center">
            <input class="form-control col-md-6" type="text" placeholder="0136a8d6a8d7b1e4c8e41e58b2f8c2">
        </div>

        <div id="button-copy" class="d-flex justify-content-center">
            <button type="button" class="btn btn-primary btn-lg">Copiar</button>
        </div>
        <form method="POST" action="{% url 'aumentar-credito' %}">
          {% csrf_token %}
              <div class="modal-footer">
              <div class="modal-footer">
                <input type="hidden" name="valor" value="{{ valor }}">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <!-- Botão de submissão do formulário -->
                <button type="submit" id="confirma" class="btn btn-success">Confirmar</button>
            </div>
        </form>
      </div>
    </div>
  </div>
