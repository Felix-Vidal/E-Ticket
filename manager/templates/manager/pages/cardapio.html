{% extends 'global/base_manager.html' %}

{% block content %}
{% include 'manager/partials/sideBar.html' %}
<div class="container">
    <form action="{% url 'cadastro_cardapio' %}" method="post">
        {% csrf_token %}
        <div class="container-cardapio">
            <h2>Cardápio:</h2>
            <p>Dia 15/10/2024</p>
            
            <div class="section-refeicoes">
                <label for="cafe">Café Da Manhã:</label>
                <textarea rows="4" cols="50" name="cafe" id="cafe"></textarea>
            </div>
    
            <div class="section-refeicoes">
                <label for="almoco">Almoço:</label>
                <textarea rows="4" cols="50" name="almoco" id="almoco"></textarea>
            </div>
    
            <div class="section-refeicoes">
                <label for="jantar">Jantar:</label>
                <textarea rows="4" cols="50" name="jantar" id="jantar"></textarea>
            </div>
            
            <div class="continuar">
                <button class="btn-continuar" type="submit">Continuar</button>
            </div>
        </div>
    </form>
    
{% endblock %}
