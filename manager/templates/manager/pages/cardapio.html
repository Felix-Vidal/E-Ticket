{% extends 'global/base_manager.html' %}

{% block content %}
{% include 'manager/partials/sideBar.html' %}

<form {% url 'menu' %} method="post">
    {% csrf_token %}
<div class="container-cardapio">
    <h2>Cardápio:</h2>
    <p>Dia 15/10/2024</p>
    
    <div class="section-refeicoes">
        <label for="cafe">Café Da Manhã:</label>
        <textarea id="cafe" rows="4" cols="50" name="cafe"></textarea>
        <div class="horarios">
            <select name="hora-inicio-cafe">
                <option>Horario de inicio</option>
                <option>06:00</option>
                <option>07:00</option>
            </select>
            <select name="hora-final-cafe">
                <option>Horario de final</option>
                <option>08:00</option>
                <option>09:00</option>
        </div>
    </div>

    <div class="section-refeicoes">
        <label for="almoco">Almoço:</label>
        <textarea id="almoco" rows="4" cols="50" name="almoco"></textarea>
        <div class="horarios">
            <select name="hora-inicio-almoco">
                <option >Horario de inicio</option>
                <option>11:00</option>
                <option>12:00</option>
            </select>
            <select name="hora-final-almoco">
                <option>Horario de final</option>
                <option>13:30</option>
                <option>14:00</option>
            </select>
        </div>
    </div>

    <div class="section-refeicoes">
        <label for="jantar">Jantar:</label>
        <textarea id="jantar" rows="4" cols="50" name="jantar"></textarea>
        <div class="horarios">
            <select name="hora-inicio-jantar">
                <option>Horario de inicio</option>
                <option>17:30</option>
                <option>18:00</option>
            </select>
            <select name="hora-final-jantar">
                <option>Horario de final</option>
                <option>19:00</option>
                <option>19:30</option>
            </select>
        </div>
    </div>
<div class="continuar">
    <button class="btn-continuar">Continuar</button>
</div>
</div>
</form>
{% endblock %}
