{% extends "global/base_manager.html" %}
{% include 'manager/pages/validar.html' %}

{% block content %}
{% include 'manager/partials/sideBar.html' %}
 

<div class="content" style="margin-left: 10%; transition: margin-left 0.s ease;">
    <div class="container-fluid d-flex justify-content-center align-items-center flex-wrap" style="margin-top: 5%; margin-left: 4em">
        <a href="{% url 'validar' %}" style="text-decoration: none;">
            <div class="card mb-3" style="width: 290px; height: 200px; border-radius: 20px; background-color: #0C4CA4; border: 2px solid #0C4CA4; color: #ffffff; margin: 10px;">
                <div class="d-flex justify-content-center align-items-center" style="height: 50%; margin-top: 15px;">
                    <i style="font-size: 100px;" class="fa-solid fa-qrcode"></i>
                </div>
                <div class="card-body text-center" style="height: 50%;">
                    <p class="card-text" style="font-size: 24px;">Validar Ticket</p>
                </div>
            </div>
        </a>
        
        
        
    
        <!-- Card 2 -->
        <a href="{% url 'vender' %}" style="text-decoration: none;">
                    
            <div class="card mb-3" style="width: 290px; height: 200px; border-radius: 20px; background-color: #0C4CA4;border: 2px solid #0C4CA4; color: #ffffff; margin: 10px;">
                <div class="d-flex justify-content-center align-items-center" style="height: 50%; margin-top: 15px;">
                    <i style="font-size: 100px;" class="fa-solid fa-ticket"></i>
                </div>
                <div class="card-body text-center" style="height: 50%;">
                    <p class="card-text" style="font-size: 24px;">Vender Ticket</p>
                </div>
            </div>
        </a>
    
        <!-- Card 3 -->
        <a href="{% url 'cardapio' %}" style="text-decoration: none;">
            <div class="card mb-3" style="width: 290px; height: 200px; border-radius: 20px; background-color: #0C4CA4; border: 6px solid #0C4CA4; color: #ffffff; margin: 10px;" >
                <div class="d-flex justify-content-center align-items-center" style="height: 50%; margin-top: 15px;">
                    <i style="font-size: 100px;" class="fa-solid fa-bowl-food"></i>
                </div>
                <div class="card-body text-center" style="height: 50%;">
                    <p class="card-text" style="font-size: 24px;">Cardápio</p>
                </div>
            </div>
        </a>
    </div>
</div>


{% endblock content %}
