{% extends "global/base_manager.html" %}

{% block content %}
{% include 'manager/partials/sideBar.html' %}

<div class="container-fluid d-flex justify-content-center align-items-start mt-5">
    <div class="col-6 col-md-6 col-lg-6 mx-auto" style="margin-left: 5%; margin-top: 5%;">
       
        <h1 class="text-center mb-4">Validar QRCode:</h1>
    
        <div class="mx-auto" style="height: 300px; width: 100%; max-width: 350px; background-color: #AEC6CF; border: none;"></div>
    
        <div class="mb-3 mt-3 text-center"> 
            <label style="font-size: 20px;" class="form-label">Entrar com código:</label>
            <input id="codigo" style="border: 2px solid #007bff; max-width: 300px;" type="email" class="form-control mx-auto" placeholder="Digite o código"> 
        </div>

        <div class="d-flex justify-content-center mb-2"> 
            <a href="{% url 'dashboard' %}" class="btn btn-secondary" style="font-size: 20px; width: 120px; margin-right: 8%;">
                <i class="fa-solid fa-arrow-left"></i> Voltar 
            </a>
            
            <a href="{% url 'validarQR' %}" class="btn btn-primary" style="font-size: 20px; background-color: #0E4DA4; width: 120px;">
                 Avançar <i class="fa-solid fa-arrow-right"></i>
            </a>
            
        </div>
    </div>
</div>

{% endblock content %}
