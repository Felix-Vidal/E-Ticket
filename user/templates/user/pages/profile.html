{% extends "global/base_user.html" %}

{% block title %}Perfil |{% endblock title %}
{% block content %}
{% include 'user/partials/header.html' %}

<div class="profile-container">
    <div class="user-info">
        <img src='../../../static/user/img/profile.png' alt="Foto do Usuário" class="user-photo">
        <div class="user-details">
            <h1 class="user-name">Jorge</h1>
            <p class="user-matricula">Matrícula: 12345678901</p>
        </div>
    </div>
    
    <div class="user-fields">
        <div class="field">
            <label>CPF:</label>
            <p>000.000.000-00</p>
        </div>
        <div class="field">
            <label>Campo:</label>
            <p>Universidade Federal do Acre</p>
        </div>
        <div class="field">
            <label>Unidade:</label>
            <p>Bacharelado em Sistemas de Informação</p>
        </div>
    </div>
</div>

{% endblock content %}
