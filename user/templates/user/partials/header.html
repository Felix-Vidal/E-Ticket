<header class="user">

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark " style="background-color: #0E4DA4;">
        <div class="container-fluid ">
            <!-- Logo -->
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="../../../static/user/img/e-ticket.png" alt="Logo" width="100" height="30"
                    class="d-inline-block align-top">
            </a>

            <!-- Menu Sanduíche -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'payment' %}">Recarregar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile' %}">Perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'menu' %}">Cardápio</a>
                    </li>
                    {% if user.is_superuser %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'manage' %}">Gerenciar</a>
                    </li>
                    {% endif %}
                    <li class="nav-item">
                        <form action="{% url 'logout' %}" method="post" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="nav-link">Sair</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</header>
