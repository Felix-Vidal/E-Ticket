<div class="container">
    <h1 class="main-title">Cardápio</h1>

    <div class="meal-section">
        <h2 class="meal-title">Café Da Manhã</h2>
        <input type="text" class="meal-description" 
               value="{% if breakfast_menu %}{{ breakfast_menu.menu }}{% else %}Indisponível{% endif %}" 
               placeholder="{% if breakfast_menu %}{{ breakfast_menu.menu }}{% else %}Indisponível{% endif %}" 
               disabled>
    
        <h2 class="meal-title">Almoço</h2>
        <input type="text" class="meal-description" 
               value="{% if lunch_menu %}{{ lunch_menu.menu }}{% else %}Indisponível{% endif %}" 
               placeholder="{% if lunch_menu %}{{ lunch_menu.menu }}{% else %}Indisponível{% endif %}" 
               disabled>
    
        <h2 class="meal-title">Janta</h2>
        <input type="text" class="meal-description" 
               value="{% if dinner_menu %}{{ dinner_menu.menu }}{% else %}Indisponível{% endif %}" 
               placeholder="{% if dinner_menu %}{{ dinner_menu.menu }}{% else %}Indisponível{% endif %}" 
               disabled>
    </div>
</div>
