<div class="container">
    <h1 class="main-title">Cardápio</h1>

    <div class="meal-section">
        {% for menu in menus %}
            <h2 class="meal-title">
                {% if menu.meal_type == "BREAKFAST" %}
                    Café Da Manhã
                {% elif menu.meal_type == "LUNCH" %}
                    Almoço
                {% else %}
                    Janta
                {% endif %}
            </h2>
            <input type="text" class="meal-description" value="{{ menu.menu }}" placeholder="{{ menu.menu }}" disabled>
        {% endfor %}
    </div>

</div>
