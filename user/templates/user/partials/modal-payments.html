<div class="modal fade" id="modal-card" tabindex="-1" aria-labelledby="modal-cardLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div id="modal-text" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-cardLabel">Cartão</h5>
                <button id="close" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="container-fluid">
                        <div  class="col-md-12">
                    <h2>Dados do Cartão</h2>
                            <div class="col-md-12">
                                <label>Número do Cartão:<span class="mandatory">*</span></label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="">
                                <div class="col-md-12">
                                    <label class="pay">Data de validade <span class="mandatory">*</span></label>
                                    <input type="text" placeholder="MM/YY" minlength="5" maxlength="5"
                                        class="form-control">
                                </div>
                                <div class="col-md-12">
                                    <label class="pay">CVV <span class="mandatory">*</span></label>
                                    <input type="password" placeholder="&#9679;&#9679;&#9679;"
                                        class="placeicon form-control" minlength="3" maxlength="3">
                                </div>
                            </div>
                            <div class="col-md-12">
                                <label>Nome no Cartão:</label>
                                <input type="text" class="form-control">

                                <label>CPF:<span class="mandatory">*</span></label>
                                <input type="text" class="form-control">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button id="salvar" type="button" class="btn btn-primary">Confirmar </button>
            </div>
        </div>
    </div>
</div>
