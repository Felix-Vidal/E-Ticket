{% if messages %}
    <div class="container mt-4">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}

<div class="container d-flex flex-column align-items-center justify-content-center mt-5">
    <h2 class="text-center mb-3" style="width: auto; color: #0E4DA4;">
        Saldo: R${{ credit|floatformat:2 }}
    </h2>
    <div class="card" style="width: 18rem; background-color: #E7EFF9;">
        <div class="card-body d-flex flex-column align-items-center">
            <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code" height="200px">
            <p class="mt-3">{{ registration_number }}</p>
        </div>
    </div>
</div>
